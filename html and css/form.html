<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<!-- FORM -->
    <title>Document</title>
</head>
<body>
<form>
    <h3>Book Your Ticket</h3>
    name : <input type="text" name="name" placeholder="Enter your name">
    <br><br>
    age : <input type="number" name="age" placeholder="Enter your age">
    <br><br>
    gender : <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name="gender" value="other"> Other
    <br><br>
    Address: <br> 
    <textarea name="address" rows="4" cols="50" placeholder="Enter your address"></textarea>
    <br><br>
    Seat No :
    <br>
    <input type="checkbox" name="seat_no" value="A1"> A1
    <input type="checkbox" name="seat_no" value="A2"> A2
    <input type="checkbox" name="seat_no" value="A3"> A3
    <br><br>
    <input type="checkbox" name="seat_no" value="B1"> B1
    <input type="checkbox" name="seat_no" value="B2"> B2
    <input type="checkbox" name="seat_no" value="B3"> B3
    <br><br>
    <input type="checkbox" name="seat_no" value="C1"> C1
    <input type="checkbox" name="seat_no" value="C2"> C2
    <input type="checkbox" name="seat_no" value="C3"> C3
    <br><br>
    Food : <input type="checkbox" name="food" value="popcorn"> Popcorn
    <input type="checkbox" name="food" value="soda"> Soda
    <input type="checkbox" name="food" value="nachos"> Nachos
    <br><br>
    File Choose : <input type="file" name="file_choose">
    <br><br>
    <input type="submit" value="Submit">
    <input type="reset" value="Clear">
</form>
</body>
</html>
